<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACME Widget Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, hsl(210 40% 98%) 0%, hsl(220 25% 96%) 100%);
      color: hsl(222 47% 11%);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 120px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.6;
      color: hsl(220 9% 46%);
    }
    code {
      background: hsl(220 14% 92%);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
    }
    .card {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid hsl(220 13% 91%);
      background: #fff;
      box-shadow: 0 4px 16px hsl(226 45% 20% / 0.04);
    }
  </style>
</head>
<body>
  <main>
    <h1>Widget test page</h1>
    <p>
      Welcome to the widget test page.
    </p>
    <div class="card">
      <p><strong>How to test:</strong> click the chat button in the bottom-right corner and send a message.</p>
      <p>Make sure the bot has a saved prompt, model, API key, and at least one indexed document.</p>
    </div>
  </main>

  <script>
    window.AcmeChatbotConfig = { botKey: 'bot_iTYjUCDZqVH3HWPzOW3tX-lZdYyq5_-f' };
  </script>
  <script async src="http://localhost:3000/api/public/widget.js"></script>
</body>
</html>
